<div class="container-fluid mb-2">
    <div class="row bg-white p-4">
    <div class="col-2">
        <img src="../../../assets/images/error-icon.png" alt="whatsapp" />
    </div>
    <div class="col-10">
        <div class="row">
            <div class="d-flex justify-content-lg-between p-0 px-3">
                <div class="header">
                    Reject Content
                </div>
                <img src="../../../assets/images/Close_round.png" width="20px" height="20px" alt="" class="cur-p" (click)="close()">
               </div>
            <div class="col-12">
              <div class="title-desc px-1">Hmm.. it is good to share a valid reason for the rejection. Share your feedback below. </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="header">
            Reason
        </div>
        <textarea class="form-control" id="Reason" rows="3" maxlength="500" placeholder="Provide a valid reason"></textarea>
    </div>
    <div class="row text-center">
        <div class="col-12">
          <button class="btn rounded-4 w-25 mt-3 mx-4 btn-border" (click)="close()">
              Cancel
          </button>
          <button class="btn rounded-4 w-25 mt-3 mx-4 btn-border" (click)="reject()">
              Reject
          </button>
          </div>
    </div>
    </div>
  </div>
