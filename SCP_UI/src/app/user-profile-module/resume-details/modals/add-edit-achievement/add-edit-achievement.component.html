<div class="card p-4">
  <div class="d-flex justify-content-lg-between">
    <div class="title mx-2">
      {{ !!formValue ? "Edit Achievements" : "Add New Achievements" }}
    </div>
    <img
      src="../../../assets/images/Close_round.png"
      width="20px"
      height="20px"
      alt=""
      class="cur-p"
      (click)="close()"
    />
  </div>
  <div class="container-fluid">
    <div class="row">
      <form [formGroup]="projectForm" (ngSubmit)="submitData()" ngbAutofocus>
        <div class="form-group mt-3">
          <label for="description" class="mb-1"
            >We recommend adding your achievements, these appear in your
            achievement's section</label
          >
          <textarea
            formControlName="description"
            placeholder="Ex: Overall academic topper in UG"
            class="w-100 text-area form-control"
            [maxlength]="maxCharsText"
          ></textarea>
          <span class="remaining-character d-flex justify-content-end">
            {{ fieldName["description"].value?.length }}/{{ maxCharsText }}
            Characters left
          </span>
        </div>
        <div class="col-12 d-flex justify-content-end mt-3">
          <button type="submit" class="btn btn-primary mt-2">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>
