<div class="container-fluid px-3" ngbAutofocus>
  <div class="d-flex justify-content-between pt-3">
    <div class="title">Applications</div>
    <div>
      <img
        class="cur-p"
        src="../../../../assets/svg/searchFilter.svg"
        alt="prev arrow"
        height="30px"
      />
    </div>
  </div>
  <div class="mt-2 mb-3">
    <app-data-table
      [tableHeader]="internshipHeader"
      [tableData]="internshipData"
      (IsApi)="getData($event)"
      (emitToolTipAction)="actionOnToolTip($event)"
      (emitLink)="viewResume($event)"
    ></app-data-table>
  </div>
  <div class="col-12 d-flex justify-content-center mb-2">
    <button
      type="button"
      (click)="close()"
      class="btn btn-primary btn-bg-white"
    >
      Cancel
    </button>
  </div>
</div>
