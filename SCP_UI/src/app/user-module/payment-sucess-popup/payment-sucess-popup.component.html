<div class="modal-content">
    <div class="border-0 d-flex justify-content-lg-between modal-header p-0 px-3">
      <div class="mt-3">
       <img src="../../../../assets/images/success-icon.png" alt="">
       <h4 class="modal-title d-inline-block mx-2" id="modal-basic-title">Verified Successfully</h4>
      </div>
      <img src="../../../assets/images/Close_round.png" alt="" class="cur-p" (click)="close()">
     </div>
    <div class="modal-body m-body p-0 px-3">
      <div class="row m-2">
        <div class="col-12 offset-1 px-3 main-text">
          <p>Woo Hoo! Your verification process is now completed!</p>
        </div>
      </div>
    </div>
    <div class="row">
        <div class="col-12 d-flex justify-content-center my-2 p-2 text-center">
          <button type="button" class="btn btn-primary w-auto " (click)="nextPayment()">Next</button>
        </div>
      </div>
  </div>
