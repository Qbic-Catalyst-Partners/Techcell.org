<div
  class="modal-header border-0 d-flex justify-content-end p-0 c-text-primary"
>
  <img
    src="../../../assets/images/Close_round.png"
    alt=""
    class="cur-p me-2 mt-2 modal-close-icon modal-close-mobile"
    (click)="close()"
  />
</div>
<div class="payment-container">
  <div class="text-center mb-4">
    <h4 class="mt-3 title">Registration Payment</h4>
    <span class="fs-tn d-inline-block mt-3 c-text-secondary">Secured by</span>
    <div>
      <img
        class="razorpay-logo"
        src="assets/temp-img/razorpay-logo.png"
        alt="Razorpay logo"
      />
    </div>

    <p class="c-text-secondary inaugural-text">
      Our inaugural offer will be ₹1000 for membership (Inclusive of GST) for
      first 1K enrolments as launch offer
    </p>

    <div class="amount-container my-4">
      <h4 class="fs-6 text-primary fw-bold">Early Bird Offer</h4>
      <h3 class="fw-bold">₹{{ paymentAmount }}</h3>
      <h5 class="og-price">₹4,999</h5>

      <!-- <p class="c-text-secondary fs-sm">Registration Fee</p> -->
      <p class="fs-sm">
        <span class="c-text-secondary">You save </span>
        <span class="text-primary fw-bold">80%</span>
      </p>
    </div>
  </div>

  <div class="d-flex justify-content-center gap-3 pb-3 align-items-center">
    <button
      class="btn c-pop-btn-outline"
      [disabled]="paymentInProgress"
      (click)="close()"
    >
      Cancel
    </button>
    <button
      class="btn c-pop-btn-primary"
      [disabled]="paymentInProgress"
      (click)="proceedToPayment()"
    >
      <span
        *ngIf="paymentInProgress"
        class="spinner-border spinner-border-sm me-2"
        role="status"
        aria-hidden="true"
      ></span>
      Pay Now
    </button>
  </div>
</div>
