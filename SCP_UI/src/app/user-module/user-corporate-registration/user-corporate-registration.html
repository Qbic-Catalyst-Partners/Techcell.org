<div class="container-fluid bg-white">
  <div class="row">
    <div class="col-12 col-md-4 col-lg-5 gx-0 d-none d-sm-block">
      <div class="bg-img-wrapper">
        <img
          src="./../../../assets/images/registration-bg.png"
          class="bg-img"
          alt=""
        />
      </div>
    </div>
    <div class="col-12 col-md-8 col-lg-7">
      <div class="col-12 col-md-12 col-lg-12 registration-box-spacing">
        <div
          class="d-flex justify-content-between align-items-end logo-container ps-1"
        >
          <div
            class="d-flex align-items-baseline flex-lg-row gap-lg-2 flex-column"
          >
            <h2
              class="d-lg-inline-block d-md-inline-block d-sm-inline-block register-text"
            >
              Register
            </h2>
            <div class="d-flex align-items-baseline flex-lg-row gap-1 gap-lg-2">
              <p class="d-lg-inline-block d-md-inline-block d-sm-inline-block">
                already have an account?
              </p>
              <a class="d-inline-block c-btn-link" routerLink="/auth">Log in</a>
            </div>
          </div>
          <div class="mt-4">
            <img
              class="logo-2"
              src="../../../assets/images/techcell-logo-beta-5.png"
              alt=""
              height="100px"
              width="auto"
            />
          </div>
        </div>
      </div>
      <div class="row registration-box-spacing">
        <div class="col-12 col-md-12 col-lg-12 registration-box">
          <div class="">
            <ul
              class="nav nav-tabs registration-type border-0"
              id="myTab"
              role="tablist"
            >
              <li class="nav-item active">
                <button class="nav-link active" type="button" role="tab">Corporate</button>
              </li>
            </ul>
            <div class="tab-content" id="TabContent tab-bg">
              <div class="tab-pane fade show active" role="tabpanel">
                <app-corporate-registration></app-corporate-registration>
              </div>
            </div>
          </div>
          <div class="registrationModeContainer"></div>
        </div>
      </div>
    </div>
