<div class="modal-header border-0 d-flex justify-content-end">
  <img
    src="../../../assets/images/Close_round.png"
    alt=""
    class="cur-p"
    (click)="close()"
  />
</div>
<div class="p-3 pt-0">
  <div class="login-box">
    <form [formGroup]="authForm" (ngSubmit)="submitForm()" autocomplete="off">
      <p class="title-text text-center">Authentication</p>
      <p class="sub-title-text mb-4 text-center">
        Let’s take another secure step! Enter the verification codes received in
        your email id and mobile.
      </p>
      <div class="form-wrapper">
        <div class="">
          <div class="d-flex flex-column mb-3">
            <label class="mb-1" for="emailId">Email ID</label>
            <input
              formControlName="emailId"
              type="email"
              class="form-control"
              id="emailId"
              placeholder="Enter your Email id"
              required
            />

            <div
              *ngIf="
                (f['emailId'].touched || isSubmitted) && f['emailId'].errors
              "
            >
              <div
                *ngIf="f['emailId'].errors?.['required']"
                class="text-danger d-inline-block mt-1"
              >
                Please enter email
              </div>
            </div>
          </div>
          <div class="d-flex flex-column">
            <label class="mb-1" for="Verification-Code"
              >Verification Code</label
            >
            <input
              formControlName="otp"
              type="text"
              class="form-control mb-3"
              id="Verification-Code"
              placeholder="Enter 6 digit code"
              maxlength="6"
              appNumberOnly
            />
            <div *ngIf="(f['otp'].touched || isSubmitted) && f['otp'].errors">
              <div
                *ngIf="f['otp'].errors?.['required']"
                class="text-danger d-inline-block mt-1"
              >
                Please enter OTP
              </div>
            </div>
          </div>
          <div class="">
            <button
              class="btn btn-primary btn-sm resend"
              type="button"
              *ngIf="this.emailCounter === 0"
              (click)="reSendEmail()"
            >
              Resend
            </button>
            <span class="resend-text d-inline-block mx-2"
              >in {{ emailCounter }} seconds</span
            >
          </div>
        </div>

        <div class="">
          <div class="d-flex flex-column mb-3">
            <label class="mb-1" for="emailId">Mobile Number</label>
            <input
              formControlName="mobile"
              type="number"
              class="form-control"
              id="mobile"
              placeholder="Enter your Number"
              required
            />

            <div
              *ngIf="(f['mobile'].touched || isSubmitted) && f['mobile'].errors"
            >
              <div
                *ngIf="f['mobile'].errors?.['required']"
                class="text-danger d-inline-block mt-1"
              >
                Please enter Mobile Number
              </div>
            </div>
          </div>
          <div class="d-flex flex-column">
            <label class="mb-1" for="Verification-Code"
              >Verification Code</label
            >
            <input
              formControlName="Motp"
              type="text"
              class="form-control mb-3"
              id="Verification-Code"
              placeholder="Enter 6 digit code"
              maxlength="6"
              appNumberOnly
            />
            <div *ngIf="(f['Motp'].touched || isSubmitted) && f['Motp'].errors">
              <div
                *ngIf="f['Motp'].errors?.['required']"
                class="text-danger d-inline-block mt-1"
              >
                Please enter OTP
              </div>
            </div>
          </div>
          <div class="">
            <button
              class="btn btn-primary btn-sm resend"
              type="button"
              *ngIf="this.mobileCounter === 0"
              (click)="reSendMobile()"
            >
              Resend
            </button>
            <span class="resend-text d-inline-block mx-2"
              >in {{ mobileCounter }} seconds</span
            >
          </div>
        </div>
      </div>
      <div class="mt-3 text-center d-flex justify-content-center">
        <button type="submit" class="btn btn-primary verify-otp-btn">
          Verify OTP
        </button>
      </div>
    </form>
  </div>
</div>
