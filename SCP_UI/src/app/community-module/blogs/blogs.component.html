<div class="blog-list">
  <div
    class="blog-card"
    *ngFor="let blogItem of blogList"
    (click)="readMore(blogItem)"
  >
    <img
      [src]="blogItem?.blog?.thumbnail"
      class="blog-card__img"
      alt=""
      onError="this.src='../../../assets/images/AI.png'"
    />
    <div class="blog-card__divider"></div>
    <div class="blog-card__content">
      <div class="blog-card__title c-text-primary">{{ blogItem?.title }}</div>
      <div class="blog-card__desc c-text-secondary">
        {{ blogItem?.shortDescription }}
      </div>
    </div>
    <button class="btn btn-primary" (click)="readMore(blogItem)">
      Read more
    </button>
  </div>
</div>
