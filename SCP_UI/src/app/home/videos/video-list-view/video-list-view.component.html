<div class="smooth-table-curve">
  <div class="table-container px-2 scroll-design" id="scroll-design">
    <table class="table table-hover m-0">
      <thead>
        <tr class="header-row">
          <th
            class="table-header"
            scope="col"
            *ngFor="let column of header_data"
            (click)="sortHeader(column)"
          >
            {{ column?.fieldName }}
            <span *ngIf="column?.isSort">
              <svg
                [class.list-down-arr]="!column.sort"
                width="12"
                height="12"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M12 5V19"
                  stroke="#9da5b9"
                  stroke-width="3"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <path
                  d="M19 12L12 19L5 12"
                  stroke="#9da5b9"
                  stroke-width="3"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </span>
          </th>
        </tr>
      </thead>
      <tbody class="scroll-section">
        <ng-container *ngFor="let row of all_data; let i = index">
          <tr
            appScroll
            (elementVisible)="getData($event)"
            [isTargetElement]="i + 1 === all_data.length"
            *ngIf="i + 1 === all_data.length"
            (click)="previewVideo(row)"
          >
            <ng-container
              *ngTemplateOutlet="content; context: { row }"
            ></ng-container>
          </tr>
          <tr *ngIf="i + 1 != all_data.length" (click)="previewVideo(row)">
            <ng-container
              *ngTemplateOutlet="content; context: { row }"
            ></ng-container>
          </tr>
        </ng-container>
        <tr *ngIf="all_data && all_data.length == 0">
          <td [attr.colspan]="header_data.length" class="text-center">
            No Record Found
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<ng-template #content let-row="row">
  <td [title]="row?.title">{{ commonService.trimText(row?.shortTitle) }}</td>
  <td>{{ row?.createdDate }}</td>
  <td [title]="row?.fullName">{{ commonService.trimText(row?.fullName) }}</td>
  <td [title]="row?.tags">{{ commonService.trimText(row?.tags, 10) }}</td>
  <td>{{ row?.views }}</td>
  <td>{{ row?.likes }}</td>
  <td
    *ngIf="userInfo.role == 'Admin'"
    [ngClass]="
      row?.status == 'Active' ? 'active-text-color' : 'Inactive-text-color'
    "
  >
    {{ row?.status }}
  </td>
  <td style="position: relative" *ngIf="userInfo.role == 'Admin'">
    <button 
        mat-icon-button
        class="action-btn"
        [ngbTooltip]="actionContent"
        [tooltipContext]="{row: row, tooltip: t}"
        triggers="manual"
        #t="ngbTooltip"
        (click)="toggleAction(row); toggleTooltip(t); $event.stopPropagation()">
        <img src="../../../../assets/svg/action-icon.svg" alt="action" class="action-icon" />
    </button>
  </td>
</ng-template>

<ng-template #actionContent let-row="row" let-tooltip="tooltip">
    <div class="action-tooltip">
        <div class="action-item" (click)="updateStatus('Active', row); tooltip.close()" *ngIf="row?.status != 'Active'">
            Activate
        </div>
        <div class="action-item" (click)="updateStatus('InActive', row); tooltip.close()" *ngIf="row?.status == 'Active'">
            InActivate
        </div>
        <div class="action-item" (click)="updateStatus('Delete', row); tooltip.close()">
            Delete
        </div>
    </div>
</ng-template>
