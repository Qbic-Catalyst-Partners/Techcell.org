<div class="modal-header d-flex justify-content-between align-items-center">
  <h5 class="modal-title">Crop Image</h5>
  <img
      src="../../../assets/images/Close_round.png"
      alt=""
      class="cur-p close-icon"
      (click)="cancel()"
    />
  
</div>
<div class="modal-body">
  <image-cropper
    [imageChangedEvent]="imageChangedEvent"
    [maintainAspectRatio]="true"
    [aspectRatio]="aspectRatio"
    [roundCropper]="round"
    [resizeToWidth]="256"
    format="png"
    output="base64"
    [transform]="transform"
    (transformChange)="transform=$event"
    (imageCropped)="imageCropped($event)"
  ></image-cropper>
</div>
<div class="modal-footer">
  <div class="me-auto d-flex align-items-center gap-2">
    <span class="small">Zoom</span>
    <input type="range" min="0.3" max="3" step="0.1" [value]="scale" (input)="onSliderChange($any($event.target).value)" style="width:150px;" />
  </div>
  <button type="button" class="btn c-pop-btn-outline fs-sm" (click)="cancel()">Cancel</button>
  <button type="button" class="btn c-pop-btn-primary fs-sm" [disabled]="!croppedBase64" (click)="save()">
    Save
  </button>
</div>
